<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-SingUP page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="Container">
        <h1 style="text-align: center;">Welcome to Shopping center</h1>
        <form id="signup" onsubmit="return submitFrom()">
            <h2 style="text-align: center;">Sign-Up</h2>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit" id="s">Sign Up</button>
            <h5 id="btmText">Already have an account? <strong onclick="Login()">Login</strong></h5>

        </form>


    
        <form  id="loginform" onsubmit="return loginFrom()">
            <h2 style="text-align: center;">Login</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            <br>
            <button type="submit" id="l">Login</button>
        <h5 id="btmText">Create a new account?<strong onclick="SignUp()">SignUp</strong></h5>

        </form>


        <!-- <button onsubmit="return submit()" id="s">Sign-Up</button> -->
        <!-- <button onclick="" id="l">Login</button> -->
        <img src="Frame.jpg" alt="Icons image" id="img1">
    </div>
    <script src="script.js">

    </script>
</body>

</html>
